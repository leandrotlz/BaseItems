<!DOCTYPE html>
<html lang="en">
<head>
  <title>Base Items</title>
  <link rel="stylesheet" href="baseitems.css">
  <meta charset="UTF-8">
</head>
<body>
  <div class="ribbon-bar" role="toolbar" aria-label="Application Ribbon">
  <div class="ribbon-head"><h1 class="ribbon-title">Base Items<br>Parser</h1></div>
  <div class="ribbon-divider" role="separator" aria-orientation="vertical"></div>
  <button id="import-dictionary-file" class="ribbon-btn">
  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 2048 2048"><title>dictionary</title><path fill="currentColor" d="M1664 0v2048H256q-53 0-99-20t-82-55t-55-81t-20-100V256q0-49 21-95t57-82t82-57t96-22zm-128 1664H256q-27 0-50 10t-40 27t-28 41t-10 50q0 27 10 50t27 40t41 28t50 10h1280zm-1408-94q60-34 128-34h1280V128H256q-23 0-46 11t-41 30t-29 41t-12 46zM384 384h896v384H384zm128 256h640V512H512z"/></svg>
  <span>Import Dictionary<br>(.ms)</span>
  </button>
  <button id="import-details-file" class="ribbon-btn" disabled autocomplete="off">
  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16"><title>arrow-import-16-filled</title><path fill="currentColor" d="M7.22 4.22a.75.75 0 0 1 1.06 0l3.5 3.5a.75.75 0 0 1 0 1.06l-3.5 3.5a.75.75 0 0 1-1.06-1.06L9.44 9H1.75a.75.75 0 0 1 0-1.5h7.69L7.22 5.28a.75.75 0 0 1 0-1.06m7.28-.47a.75.75 0 0 0-1.5 0v8.5a.75.75 0 0 0 1.5 0z"/></svg>
  <span>Import Details<br>(.details)</span>
  </button>
  <div class="ribbon-divider" role="separator" aria-orientation="vertical"></div>
  <button id="export-json-file" class="ribbon-btn" disabled autocomplete="off">
  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16"><title>arrow-export-16-filled</title><path fill="currentColor" d="M1.75 3a.75.75 0 0 1 .75.75v8.5a.75.75 0 0 1-1.5 0v-8.5A.75.75 0 0 1 1.75 3m8.47.72a.75.75 0 0 1 1.06 0l3.5 3.5a.75.75 0 0 1 0 1.06l-3.5 3.5a.75.75 0 1 1-1.06-1.06l2.22-2.22H4.75a.75.75 0 0 1 0-1.5h7.69l-2.22-2.22a.75.75 0 0 1 0-1.06"/></svg>
  <span>Export JSON</span>
  </button>
  <input id="dictionary-file-input" type="file" accept=".ms" class="hidden">
  <input id="details-file-input" type="file" accept=".details" class="hidden">
  </div>
  <pre id="json-preview"></pre>
  <script src="baseitems.js" type="module"></script>
</body>
</html>
