<!DOCTYPE html>
<html lang="en">
<head>
  <title>Base Items</title>
  <link rel="stylesheet" href="baseitems.css">
  <meta charset="UTF-8">
</head>
<body>
  <div class="ribbon-bar" role="toolbar" aria-label="Application Ribbon">
    <div class="ribbon-head"><h1 class="ribbon-title">Base Items<br>Parser</h1></div>
    <div class="ribbon-divider" role="separator" aria-orientation="vertical"></div>
    <button id="open-json-btn" class="ribbon-btn" autocomplete="off">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512"><title>open-file</title><g fill="currentColor" fill-rule="evenodd"><path d="m220.75 85.334l43.511 34.405l-30.377 30.377L205.917 128H85.334v210.774l39.354-125.44H384v-.001h96l-64.75 213.334H42.667V85.334zM422.458 256H156.021l-40.167 128h267.771z"/><path fill-rule="nonzero" d="M426.667 42.667V192H384v-76.497L307.504 192h-60.34L353.83 85.333h-76.496V42.668z"/></g></svg>
      <span>Open JSON</span>
    </button>
    <button id="save-json-btn" class="ribbon-btn" disabled autocomplete="off">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512"><title>download</title><path fill="currentColor" d="M426.666 426.667H85.333V384h341.333zm-149.333-179.5l91.583-91.583l30.167 30.166L256 328.834L112.916 185.75l30.167-30.166l91.583 91.582v-204.5h42.667z"/></svg>
      <span>Save JSON</span>
    </button>
    <div class="ribbon-divider" role="separator" aria-orientation="vertical"></div>
    <button id="import-data-btn" class="ribbon-btn" autocomplete="off">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512"><title>import</title><path fill="currentColor" fill-rule="evenodd" d="M448 85.333V448H64V170.666h42.667v234.667h298.667V128H320V85.333zm-277.333 0c57.36 0 104.145 45.276 106.568 102.04l.099 4.627l-.001 76.485l48.916-48.904l30.17 30.17L256 350.17L155.582 249.75l30.17-30.17l48.915 48.904V192c0-34.084-26.644-61.945-60.24-63.892l-3.76-.108h-128V85.333z"/></svg>
      <span>Import Data</span>
    </button>
    <button id="export-data-btn" class="ribbon-btn" autocomplete="off" disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512"><title>export</title><path fill="currentColor" fill-rule="evenodd" d="M234.667 85.333V128h-128v277.333h298.666v-128H448V448H64V85.333zm143.085-36.418L478.17 149.333L377.752 249.752l-30.17-30.17l48.903-48.916h-55.152c-34.084 0-61.944 26.644-63.891 60.24l-.109 3.76v106.667h-42.666V234.667c0-57.36 45.276-104.146 102.04-106.569l4.626-.098l55.151-.001l-48.902-48.914z"/></svg>
      <span>Export Data</span>
    </button>
    <div class="ribbon-divider" role="separator" aria-orientation="vertical"></div>
    <button id="compare-json-btn" class="ribbon-btn" disabled autocomplete="off">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512"><title>compare</title><path fill="currentColor" fill-rule="evenodd" d="m313.848 441.686l30.166-30.166l-48.916-48.917h174.235v-42.667H295.098l48.916-48.917l-30.166-30.166l-100.515 100.416zM198.144 70.185l100.523 100.418l-100.523 100.415l-30.166-30.166l48.915-48.916H42.667v-42.667h174.229l-48.918-48.918z" clip-rule="evenodd"/></svg>
      <span>Compare JSON</span>
    </button>
    <input id="json-file-input" type="file" accept=".json" class="hidden">
    <input id="compare-json-file-input" type="file" accept=".json" class="hidden">
  </div>
  <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-dialog-title">
    <h2 id="import-dialog-title" class="import-dialog-title">Import Data</h2>
    <div class="import-field">
      <span class="import-field-label">Dictionary (.ms)</span>
      <button id="choose-dictionary-file" type="button" class="import-btn">Browse...</button>
      <span id="dictionary-file-name" class="import-file-name" data-placeholder="No file selected"></span>
      <input id="dictionary-file-input" type="file" accept=".ms" class="hidden">
    </div>
    <div class="import-field">
      <span class="import-field-label">Details (.details)</span>
      <button id="choose-details-file" type="button" class="import-btn">Browse...</button>
      <span id="details-file-name" class="import-file-name" data-placeholder="No file selected"></span>
      <input id="details-file-input" type="file" accept=".details" class="hidden">
    </div>
    <div class="import-dialog-actions">
      <button id="import-dialog-cancel" type="button" class="import-btn">Cancel</button>
    </div>
  </dialog>
  <div id="tab-container" class="tab-container hidden">
  <div id="tab-bar" class="tab-bar"></div>
  <div id="tab-content-wrapper" class="tab-content-wrapper"></div>
  </div>
  <script src="baseitems.js" type="module"></script>
</body>
</html>
